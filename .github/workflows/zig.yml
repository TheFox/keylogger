name: Keylogger

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        zig-version:
          - '0.17.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Check Zig version
        run: zig version

      - name: Build Loop
        run: zig build install --release -Dci=true -Dmethod=loop

      - name: Build Hook
        run: zig build install --release -Dci=true -Dmethod=hook

      - name: Check Loop Help
        run: ./zig-out/bin/keylogger-loop.exe --help

      - name: Check Hook Help
        run: ./zig-out/bin/keylogger-hook.exe --help
